<html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{font-family:Arial;background:#eef6ff}.c{max-width:800px;margin:auto}.card{background:#fff;padding:20px;border-radius:12px}button,input{width:100%;padding:12px;margin-top:8px}</style></head><body><div class='c'><div id='quiz' class='card'><h2>Fresh Quiz</h2><div id='s'></div><div id='p'></div><p id='q'></p><input id='a'><button id='b' onclick='ck()'>Check</button><div id='f'></div><button id='n' onclick='nx()' disabled>Next</button></div><div id='r' class='card' style='display:none'></div></div><script>const Q=[{"type": "number", "question": "A school has 9 rows of chairs with 16 chairs in each row. Twelve chairs are taken away for repairs. How many chairs remain?", "answer": 132}, {"type": "number", "question": "A baker makes 84 cupcakes. He packs them equally into 7 boxes and decorates each box with 2 extra cupcakes. How many cupcakes are in each box?", "answer": 14}, {"type": "number", "question": "Meera has ₹750. She buys a backpack for ₹320 and two notebooks costing ₹65 each. How much money does she have left?", "answer": 300}, {"type": "number", "question": "A bus leaves at 7:20 AM and reaches school at 8:05 AM. How many minutes does the journey take?", "answer": 45}, {"type": "number", "question": "Think of a number. Divide it by 5 and then add 9. The result is 17. What is the number?", "answer": 40}, {"type": "number", "question": "A square garden has each side measuring 11 metres. How many metres is the fence needed around it?", "answer": 44}, {"type": "number", "question": "The library has 360 books. It gives 95 books to another school and receives 48 new books. How many books are in the library now?", "answer": 313}, {"type": "number", "question": "A water bottle holds 2 litres. A sports team fills 18 bottles. How many litres of water do they use altogether?", "answer": 36}, {"type": "number", "question": "Find the missing number: 9, 15, 24, 36, 51, __", "answer": 69}, {"type": "number", "question": "One angle is 58°. The other two angles of the triangle are equal. Find each of the equal angles.", "answer": 61}, {"type": "text", "question": "The music teacher asked students to bring a notebook and a pencil for the rehearsal. Riya brought both items. What did Riya remember to bring?", "accepted": ["a notebook and a pencil", "notebook and pencil"]}, {"type": "text", "question": "The school announced that Friday would be a traditional dress day. Aarav wore traditional clothes instead of his regular uniform. Why did Aarav wear traditional clothes?", "accepted": ["because it was traditional dress day", "it was traditional dress day"]}, {"type": "text", "question": "Before starting the experiment, the science teacher asked everyone to wear safety glasses. Why were the glasses important?", "accepted": ["for safety", "to protect their eyes"]}, {"type": "text", "question": "The classroom lights were switched off because bright sunlight was coming through the windows. Why were the lights switched off?", "accepted": ["because there was enough sunlight", "the room was already bright"]}, {"type": "text", "question": "Vikram borrowed his sister's dictionary to check the meaning of a difficult word. What was Vikram trying to find?", "accepted": ["the meaning of a difficult word", "the meaning of the word"]}, {"type": "text", "question": "The football match was delayed because the ground was too wet after heavy rain. Why was the match delayed?", "accepted": ["because the ground was too wet", "the ground was wet"]}, {"type": "text", "question": "The teacher collected all the answer sheets before the bell rang. What did the teacher collect?", "accepted": ["answer sheets", "the answer sheets"]}, {"type": "text", "question": "Anjali watered the plants every evening during her grandmother's holiday. Why did Anjali water the plants?", "accepted": ["to take care of the plants", "to care for the plants"]}, {"type": "text", "question": "The notice said, 'Please return all library books by Wednesday.' By which day should students return the books?", "accepted": ["wednesday"]}, {"type": "text", "question": "Karan packed an extra tiffin because his friend had forgotten lunch the previous day. Why did Karan pack extra food?", "accepted": ["for his friend", "to share with his friend"]}];let i=0,c=0,w=0,R=[];const s=document.getElementById('s'),p=document.getElementById('p'),q=document.getElementById('q'),a=document.getElementById('a'),f=document.getElementById('f'),b=document.getElementById('b'),n=document.getElementById('n');const norm=t=>t.toLowerCase().trim().replace(/[.,!?]/g,'').replace(/\s+/g,' ');function sh(){let x=Q[i];s.textContent=i<10?'Maths':'English';p.textContent='Question '+(i+1)+' of 20';q.textContent=x.question;a.value='';a.disabled=false;b.disabled=false;n.disabled=true;f.textContent='';}function ck(){let t=a.value.trim();if(!t)return;let x=Q[i],ok=x.type==='number'?Number(t)===x.answer:x.accepted.some(y=>norm(y)===norm(t));a.disabled=true;b.disabled=true;if(ok){c++;R.push({a:t,o:true});f.textContent='Congratulations!';}else{w++;R.push({a:t,o:false});f.textContent='Better luck next time!';}n.disabled=false;}function nx(){if(i<19){i++;sh();}else fin();}function fin(){document.getElementById('quiz').style.display='none';let h='<h2>Score '+c+'/20</h2>';Q.forEach((x,j)=>{let ca=x.type==='number'?x.answer:x.accepted[0];h+='<p><b>Q'+(j+1)+'</b> '+x.question+'<br>Your: '+R[j].a+'<br>Correct: '+ca+'</p>';});let rr=document.getElementById('r');rr.style.display='block';rr.innerHTML=h;}a.addEventListener('keydown',e=>{if(e.key==='Enter'&&!b.disabled)ck();});sh();</script></body></html>
