<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths & English Challenge</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#e8f4ff,#fff7e6);
    color:#222;
    min-height:100vh;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:24px;
    margin:15px 0;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

h1{
    font-size:clamp(27px,6vw,38px);
    margin:5px 0;
}

.small{color:#666;}

.section{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    background:#eee;
    font-weight:bold;
    margin:12px 0;
}

.progress{
    font-weight:bold;
    margin:10px 0 18px;
}

.question{
    font-size:clamp(19px,4vw,25px);
    line-height:1.55;
    margin:20px 0;
}

input{
    width:100%;
    padding:14px;
    font-size:20px;
    border:2px solid #aaa;
    border-radius:10px;
    margin:8px 0 12px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.primary{
    background:#2878d4;
    color:white;
    width:100%;
}

.next{
    background:#333;
    color:white;
    width:100%;
}

.dashboard{
    background:#777;
    color:white;
}

button:disabled,
input:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.feedback{
    display:none;
    margin:16px 0;
    padding:15px;
    border-radius:12px;
    font-size:19px;
    font-weight:bold;
}

.correct{
    background:#e4f8e8;
    color:#14752c;
}

.wrong{
    background:#fff0e8;
    color:#b23b10;
}

.score{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:20px;
}

.review{
    padding:14px;
    margin:12px 0;
    border-radius:10px;
    border:1px solid #ddd;
    line-height:1.5;
}

.right{
    background:#f2fff4;
    border-left:7px solid #28a745;
}

.incorrect{
    background:#fff5f5;
    border-left:7px solid #dc3545;
}

@media(max-width:600px){
    .container{padding:8px;}
    .card{padding:18px;}
}
</style>
</head>

<body>

<div class="container">

<div id="quizScreen" class="card">

<div class="header">
<div>
<h1>🧠 Maths & English Challenge</h1>
<div class="small">380 Questions • Maths • Comprehension • Vocabulary</div>
</div>

<button class="dashboard" onclick="goDashboard()">
Dashboard
</button>

</div>

<div id="section" class="section"></div>

<div id="progress" class="progress"></div>

<div id="question" class="question"></div>

<label><strong>Your answer:</strong></label>

<input
id="answer"
type="text"
placeholder="Type your answer">

<button
id="checkBtn"
class="primary"
onclick="checkAnswer()">
Check Answer
</button>

<div id="feedback" class="feedback"></div>

<button
id="nextBtn"
class="next"
onclick="nextQuestion()"
disabled>
Next ➜
</button>

</div>

<div
id="resultScreen"
class="card"
style="display:none">
</div>

</div>

<script>


const QUESTIONS = [

/* ===========================
   1–10 MATHS & LOGIC
=========================== */

{type:'number',question:'A shop has 24 boxes with 18 chocolates in each box. It sells 156 chocolates. How many chocolates remain?',answer:276},

{type:'number',question:'A train travels 168 km in the morning and 132 km in the evening. How many kilometres did it travel altogether?',answer:300},

{type:'number',question:'A farmer has 96 mango trees. Each tree gives 25 mangoes. How many mangoes are produced?',answer:2400},

{type:'number',question:'A rectangle is 18 m long and 12 m wide. Find its perimeter.',answer:60},

{type:'number',question:'Find the missing number: 8, 17, 35, 71, ?',answer:143},

{type:'number',question:'A family spends ₹2450 on groceries and ₹875 on vegetables. What is the total amount spent?',answer:3325},

{type:'number',question:'One angle of a triangle is 56° and another is 49°. Find the third angle.',answer:75},

{type:'number',question:'A water tank holds 950 litres. After using 285 litres, how much water remains?',answer:665},

{type:'number',question:'A school has 18 classrooms with 32 students in each classroom. How many students are there altogether?',answer:576},

{type:'number',question:'A cricket player scores 45, 62, 51 and 58 runs. Find the average score.',answer:54},

/* ===========================
   11–20 ENGLISH GRAMMAR
   (ONE CORRECT ANSWER)
=========================== */

{type:'text',question:'She bought ___ orange from the market.',accepted:['an']},

{type:'text',question:'The baby ___ sleeping now.',accepted:['is']},

{type:'text',question:'Birds fly ___ the sky.',accepted:['in']},

{type:'text',question:'Please sit ___ your chair.',accepted:['on']},

{type:'text',question:'Water ___ at 100°C.',accepted:['boils']},

{type:'text',question:'This is ___ pencil. (belongs to me)',accepted:['my']},

{type:'text',question:'Ravi and I are friends. ___ play football together.',accepted:['we']},

{type:'text',question:'You ___ wear a seat belt while driving.',accepted:['must']},

{type:'text',question:'The teacher asked us ___ listen carefully.',accepted:['to']},

{type:'text',question:'I was tired, ___ I went to bed early.',accepted:['so']},

/* ===========================
   21–30 VOCABULARY
   (ONE CORRECT ANSWER)
=========================== */

{type:'text',question:'A person who designs buildings is an ______.',accepted:['architect']},

{type:'text',question:'A book of maps is called an ______.',accepted:['atlas']},

{type:'text',question:'A person who repairs shoes is a ______.',accepted:['cobbler']},

{type:'text',question:'A doctor who treats animals is a ______.',accepted:['veterinarian']},

{type:'text',question:'A person who grows crops is a ______.',accepted:['farmer']},

{type:'text',question:'A person who writes books is an ______.',accepted:['author']},

{type:'text',question:'A person who cuts men\\'s hair is a ______.',accepted:['barber']},

{type:'text',question:'A scientist who studies stars is an ______.',accepted:['astronomer']},

{type:'text',question:'A person who paints pictures is an ______.',accepted:['artist']},

{type:'text',question:'A person who flies an aeroplane is a ______.',accepted:['pilot']},

/* ===========================
   31–80 SPEED MATHS
=========================== */

/* Addition */

{type:'number',question:'27 + 15 = ?',answer:42},
{type:'number',question:'48 + 36 = ?',answer:84},
{type:'number',question:'125 + 74 = ?',answer:199},
{type:'number',question:'69 + 28 = ?',answer:97},
{type:'number',question:'144 + 56 = ?',answer:200},
{type:'number',question:'215 + 89 = ?',answer:304},
{type:'number',question:'38 + 47 = ?',answer:85},
{type:'number',question:'92 + 18 = ?',answer:110},
{type:'number',question:'173 + 26 = ?',answer:199},
{type:'number',question:'56 + 39 = ?',answer:95},
{type:'number',question:'84 + 17 = ?',answer:101},
{type:'number',question:'305 + 44 = ?',answer:349},
{type:'number',question:'199 + 101 = ?',answer:300},

/* Subtraction */

{type:'number',question:'18 - 9 = ?',answer:9},
{type:'number',question:'45 - 17 = ?',answer:28},
{type:'number',question:'99 - 29 = ?',answer:70},
{type:'number',question:'120 - 38 = ?',answer:82},
{type:'number',question:'250 - 95 = ?',answer:155},
{type:'number',question:'86 - 48 = ?',answer:38},
{type:'number',question:'500 - 175 = ?',answer:325},
{type:'number',question:'63 - 27 = ?',answer:36},
{type:'number',question:'340 - 160 = ?',answer:180},
{type:'number',question:'91 - 56 = ?',answer:35},
{type:'number',question:'800 - 275 = ?',answer:525},
{type:'number',question:'72 - 19 = ?',answer:53},
{type:'number',question:'150 - 68 = ?',answer:82},

/* Multiplication */

{type:'number',question:'6 × 8 = ?',answer:48},
{type:'number',question:'7 × 9 = ?',answer:63},
{type:'number',question:'12 × 11 = ?',answer:132},
{type:'number',question:'15 × 6 = ?',answer:90},
{type:'number',question:'14 × 8 = ?',answer:112},
{type:'number',question:'13 × 7 = ?',answer:91},
{type:'number',question:'9 × 12 = ?',answer:108},
{type:'number',question:'16 × 5 = ?',answer:80},
{type:'number',question:'18 × 4 = ?',answer:72},
{type:'number',question:'25 × 8 = ?',answer:200},
{type:'number',question:'17 × 3 = ?',answer:51},
{type:'number',question:'19 × 6 = ?',answer:114},

/* Division */

{type:'number',question:'26 ÷ 2 = ?',answer:13},
{type:'number',question:'99 ÷ 3 = ?',answer:33},
{type:'number',question:'144 ÷ 12 = ?',answer:12},
{type:'number',question:'84 ÷ 7 = ?',answer:12},
{type:'number',question:'96 ÷ 8 = ?',answer:12},
{type:'number',question:'120 ÷ 10 = ?',answer:12},
{type:'number',question:'180 ÷ 9 = ?',answer:20},
{type:'number',question:'132 ÷ 11 = ?',answer:12},
{type:'number',question:'72 ÷ 6 = ?',answer:12},
{type:'number',question:'225 ÷ 15 = ?',answer:15},
{type:'number',question:'156 ÷ 12 = ?',answer:13},
{type:'number',question:'240 ÷ 8 = ?',answer:30}

];


/* ===========================
   QUIZ ENGINE
=========================== */

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

const sectionEl = document.getElementById("section");
const progressEl = document.getElementById("progress");
const questionEl = document.getElementById("question");
const answerEl = document.getElementById("answer");
const feedbackEl = document.getElementById("feedback");
const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");

function normalise(text){
    return text.toLowerCase()
               .trim()
               .replace(/[.,!?]/g,"")
               .replace(/\s+/g," ");
}

function loadQuestion(){

    const q = QUESTIONS[currentQuestion];

    if(currentQuestion < 10)
        sectionEl.innerHTML = "🔢 Maths & Logic";
    else if(currentQuestion < 20)
        sectionEl.innerHTML = "📖 English Comprehension";
    else
        sectionEl.innerHTML = "📚 Vocabulary";

    progressEl.innerHTML =
        "Question " + (currentQuestion+1) + " of " + QUESTIONS.length;

    questionEl.innerHTML = q.question;

    answerEl.value="";
    answerEl.disabled=false;

    checkBtn.disabled=false;
    nextBtn.disabled=true;

    feedbackEl.style.display="none";

    nextBtn.innerHTML =
        (currentQuestion===QUESTIONS.length-1)
        ? "Finish Quiz"
        : "Next ➜";
}

function checkAnswer(){

    const q = QUESTIONS[currentQuestion];
    const user = answerEl.value.trim();

    if(user===""){
        alert("Please enter an answer.");
        return;
    }

    let correct=false;

    if(q.type==="number"){
        correct = Number(user)===q.answer;
    }else{
        const u = normalise(user);
        correct = q.accepted.some(a=>normalise(a)===u);
    }

    userAnswers.push({
        answer:user,
        correct:correct
    });

    answerEl.disabled=true;
    checkBtn.disabled=true;

    feedbackEl.style.display="block";

    if(correct){
        score++;
        feedbackEl.className="feedback correct";
        feedbackEl.innerHTML="🎉 Congratulations! Your answer is correct.";
    }else{
        feedbackEl.className="feedback wrong";
        feedbackEl.innerHTML="😊 Better luck next time!";
    }

    nextBtn.disabled=false;
}

function nextQuestion(){

    if(currentQuestion < QUESTIONS.length-1){
        currentQuestion++;
        loadQuestion();
    }else{
        showResults();
    }
}

function showResults(){

    document.getElementById("quizScreen").style.display="none";

    const result = document.getElementById("resultScreen");
    result.style.display="block";

    saveAttempt();

    let html = `
        <h1>🏆 Quiz Complete!</h1>
        <div class="score">${score} / ${QUESTIONS.length}</div>
        <h2>Final Review</h2>
    `;

    QUESTIONS.forEach((q,index)=>{

        const ua = userAnswers[index];
        const correct =
            q.type==="number"
            ? q.answer
            : q.accepted[0];

        html += `
        <div class="review ${ua.correct?'right':'incorrect'}">

        <b>Question ${index+1}</b><br><br>

        <b>${
            index<10
            ? 'Maths'
            : index<20
            ? 'Comprehension'
            : 'Vocabulary'
        }</b>

        <p>${q.question}</p>

        Your answer:
        <b>${ua.answer}</b><br>

        Correct answer:
        <b>${correct}</b><br><br>

        ${ua.correct?'✅ Correct':'❌ Wrong'}

        </div>`;
    });

    html += `
    <button class="primary"
            onclick="location.reload()">
        Attempt Again
    </button>`;

    result.innerHTML = html;
}

/* ===========================
   DASHBOARD
=========================== */

function saveAttempt(){

    const today = new Date().toISOString().slice(0,10);

    const data =
        JSON.parse(localStorage.getItem("quizAttempts") || "[]");

    data.push({
        date:today,
        score:score,
        total:QUESTIONS.length
    });

    localStorage.setItem(
        "quizAttempts",
        JSON.stringify(data)
    );
}

function goDashboard(){

    const data =
      JSON.parse(localStorage.getItem("quizAttempts") || "[]");

    if(data.length===0){
        alert("No quiz attempts yet.");
        return;
    }

    let msg = "QUIZ DASHBOARD\n\n";

    const grouped={};

    data.forEach(a=>{
        if(!grouped[a.date]) grouped[a.date]=[];
        grouped[a.date].push(a.score);
    });

    Object.keys(grouped).sort().reverse().forEach(d=>{
        msg += d + "  (" + grouped[d].length + " attempt(s))\n";

        grouped[d].forEach((s,i)=>{
            msg += "   Attempt " + (i+1) +
                   " : " + s + "/30\n";
        });

        msg += "\n";
    });

    alert(msg);
}

/* ===========================
   START QUIZ
=========================== */

answerEl.addEventListener("keydown",function(e){

    if(e.key==="Enter" && !checkBtn.disabled){
        checkAnswer();
    }

});

loadQuestion();

</script>

</body>
</html>
