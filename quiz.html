<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths & English Challenge</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#e8f4ff,#fff7e6);
    color:#222;
    min-height:100vh;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:24px;
    margin:15px 0;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

h1{
    font-size:clamp(27px,6vw,38px);
    margin:5px 0;
}

.small{color:#666;}

.section{
    display:inline-block;
    padding:7px 12px;
    border-radius:20px;
    background:#eee;
    font-weight:bold;
    margin:12px 0;
}

.progress{
    font-weight:bold;
    margin:10px 0 18px;
}

.question{
    font-size:clamp(19px,4vw,25px);
    line-height:1.55;
    margin:20px 0;
}

input{
    width:100%;
    padding:14px;
    font-size:20px;
    border:2px solid #aaa;
    border-radius:10px;
    margin:8px 0 12px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.primary{
    background:#2878d4;
    color:white;
    width:100%;
}

.next{
    background:#333;
    color:white;
    width:100%;
}

.dashboard{
    background:#777;
    color:white;
}

button:disabled,
input:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.feedback{
    display:none;
    margin:16px 0;
    padding:15px;
    border-radius:12px;
    font-size:19px;
    font-weight:bold;
}

.correct{
    background:#e4f8e8;
    color:#14752c;
}

.wrong{
    background:#fff0e8;
    color:#b23b10;
}

.score{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:20px;
}

.review{
    padding:14px;
    margin:12px 0;
    border-radius:10px;
    border:1px solid #ddd;
    line-height:1.5;
}

.right{
    background:#f2fff4;
    border-left:7px solid #28a745;
}

.incorrect{
    background:#fff5f5;
    border-left:7px solid #dc3545;
}

@media(max-width:600px){
    .container{padding:8px;}
    .card{padding:18px;}
}
</style>
</head>

<body>

<div class="container">

<div id="quizScreen" class="card">

<div class="header">
<div>
<h1>🧠 Maths & English Challenge</h1>
<div class="small">30 Questions • Maths • Comprehension • Vocabulary</div>
</div>

<button class="dashboard" onclick="goDashboard()">
Dashboard
</button>

</div>

<div id="section" class="section"></div>

<div id="progress" class="progress"></div>

<div id="question" class="question"></div>

<label><strong>Your answer:</strong></label>

<input
id="answer"
type="text"
placeholder="Type your answer">

<button
id="checkBtn"
class="primary"
onclick="checkAnswer()">
Check Answer
</button>

<div id="feedback" class="feedback"></div>

<button
id="nextBtn"
class="next"
onclick="nextQuestion()"
disabled>
Next ➜
</button>

</div>

<div
id="resultScreen"
class="card"
style="display:none">
</div>

</div>

<script>


const QUESTIONS = [

/* ===========================
   1–10 MATHS & LOGIC
=========================== */

{
type:'number',
question:'A fruit shop has 18 baskets with 24 apples in each basket. It sells 156 apples. How many apples remain?',
answer:276
},

{
type:'number',
question:'A train travels 145 km in the morning and 178 km in the afternoon. It then returns 39 km to the previous station. How many kilometres did it travel altogether?',
answer:362
},

{
type:'number',
question:'Neha has ₹950. She buys a dictionary for ₹275 and four pens costing ₹38 each. How much money is left?',
answer:523
},

{
type:'number',
question:'A classroom has 14 rows with 9 desks in each row. If 27 desks are removed for repairs, how many desks remain?',
answer:99
},

{
type:'number',
question:'Find the missing number: 6, 13, 27, 55, 111, ?',
answer:223
},

{
type:'number',
question:'The perimeter of a square is 84 cm. Find the length of one side.',
answer:21
},

{
type:'number',
question:'A cricket player scores 48, 72, 65 and 55 runs in four matches. What is the average score?',
answer:60
},

{
type:'number',
question:'A bicycle costs ₹3600. During a sale, it is sold at a discount of ₹540. What is the selling price?',
answer:3060
},

{
type:'number',
question:'One angle of a triangle is 47°. Another angle is 68°. Find the third angle.',
answer:65
},

{
type:'number',
question:'A baker prepares 420 biscuits and packs them equally into 12 tins. How many biscuits are in each tin?',
answer:35
},

/* ===========================
   11–20 ENGLISH FILL IN THE BLANKS
=========================== */

{
type:'text',
question:'We _____ a wonderful movie last Saturday.',
accepted:['watched']
},

{
type:'text',
question:'The children _____ happily in the playground every evening.',
accepted:['play']
},

{
type:'text',
question:'Please put your bag _____ the table.',
accepted:['under']
},

{
type:'text',
question:'She is _____ honest student in our class.',
accepted:['an']
},

{
type:'text',
question:'My father _____ tea every morning.',
accepted:['drinks']
},

{
type:'text',
question:'The cat jumped _____ the wall.',
accepted:['over']
},

{
type:'text',
question:'Ravi is the _____ boy in his family.',
accepted:['youngest']
},

{
type:'text',
question:'The teacher asked us _____ our books quietly.',
accepted:['to open']
},

{
type:'text',
question:'It _____ heavily throughout the night yesterday.',
accepted:['rained']
},

{
type:'text',
question:'The Earth _____ around the Sun.',
accepted:['revolves']
},

/* ===========================
   21–30 ONE-WORD VOCABULARY
=========================== */

{
type:'text',
question:'A person who paints pictures is called an ______.',
accepted:['artist']
},

{
type:'text',
question:'The opposite of noisy is ______.',
accepted:['quiet']
},

{
type:'text',
question:'A person who teaches in a school is a ______.',
accepted:['teacher']
},

{
type:'text',
question:'A book of maps is called an ______.',
accepted:['atlas']
},

{
type:'text',
question:'To move quickly on foot is to ______.',
accepted:['run']
},

{
type:'text',
question:'A person who repairs shoes is a ______.',
accepted:['cobbler']
},

{
type:'text',
question:'The opposite of difficult is ______.',
accepted:['easy']
},

{
type:'text',
question:'A large area covered with trees is called a ______.',
accepted:['forest']
},

{
type:'text',
question:'A person who grows crops is a ______.',
accepted:['farmer']
},

{
type:'text',
question:'The word meaning “very brave” is ______.',
accepted:['courageous']
}

];


/* ===========================
   QUIZ ENGINE
=========================== */

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

const sectionEl = document.getElementById("section");
const progressEl = document.getElementById("progress");
const questionEl = document.getElementById("question");
const answerEl = document.getElementById("answer");
const feedbackEl = document.getElementById("feedback");
const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");

function normalise(text){
    return text.toLowerCase()
               .trim()
               .replace(/[.,!?]/g,"")
               .replace(/\s+/g," ");
}

function loadQuestion(){

    const q = QUESTIONS[currentQuestion];

    if(currentQuestion < 10)
        sectionEl.innerHTML = "🔢 Maths & Logic";
    else if(currentQuestion < 20)
        sectionEl.innerHTML = "📖 English Comprehension";
    else
        sectionEl.innerHTML = "📚 Vocabulary";

    progressEl.innerHTML =
        "Question " + (currentQuestion+1) + " of " + QUESTIONS.length;

    questionEl.innerHTML = q.question;

    answerEl.value="";
    answerEl.disabled=false;

    checkBtn.disabled=false;
    nextBtn.disabled=true;

    feedbackEl.style.display="none";

    nextBtn.innerHTML =
        (currentQuestion===QUESTIONS.length-1)
        ? "Finish Quiz"
        : "Next ➜";
}

function checkAnswer(){

    const q = QUESTIONS[currentQuestion];
    const user = answerEl.value.trim();

    if(user===""){
        alert("Please enter an answer.");
        return;
    }

    let correct=false;

    if(q.type==="number"){
        correct = Number(user)===q.answer;
    }else{
        const u = normalise(user);
        correct = q.accepted.some(a=>normalise(a)===u);
    }

    userAnswers.push({
        answer:user,
        correct:correct
    });

    answerEl.disabled=true;
    checkBtn.disabled=true;

    feedbackEl.style.display="block";

    if(correct){
        score++;
        feedbackEl.className="feedback correct";
        feedbackEl.innerHTML="🎉 Congratulations! Your answer is correct.";
    }else{
        feedbackEl.className="feedback wrong";
        feedbackEl.innerHTML="😊 Better luck next time!";
    }

    nextBtn.disabled=false;
}

function nextQuestion(){

    if(currentQuestion < QUESTIONS.length-1){
        currentQuestion++;
        loadQuestion();
    }else{
        showResults();
    }
}

function showResults(){

    document.getElementById("quizScreen").style.display="none";

    const result = document.getElementById("resultScreen");
    result.style.display="block";

    saveAttempt();

    let html = `
        <h1>🏆 Quiz Complete!</h1>
        <div class="score">${score} / ${QUESTIONS.length}</div>
        <h2>Final Review</h2>
    `;

    QUESTIONS.forEach((q,index)=>{

        const ua = userAnswers[index];
        const correct =
            q.type==="number"
            ? q.answer
            : q.accepted[0];

        html += `
        <div class="review ${ua.correct?'right':'incorrect'}">

        <b>Question ${index+1}</b><br><br>

        <b>${
            index<10
            ? 'Maths'
            : index<20
            ? 'Comprehension'
            : 'Vocabulary'
        }</b>

        <p>${q.question}</p>

        Your answer:
        <b>${ua.answer}</b><br>

        Correct answer:
        <b>${correct}</b><br><br>

        ${ua.correct?'✅ Correct':'❌ Wrong'}

        </div>`;
    });

    html += `
    <button class="primary"
            onclick="location.reload()">
        Attempt Again
    </button>`;

    result.innerHTML = html;
}

/* ===========================
   DASHBOARD
=========================== */

function saveAttempt(){

    const today = new Date().toISOString().slice(0,10);

    const data =
        JSON.parse(localStorage.getItem("quizAttempts") || "[]");

    data.push({
        date:today,
        score:score,
        total:QUESTIONS.length
    });

    localStorage.setItem(
        "quizAttempts",
        JSON.stringify(data)
    );
}

function goDashboard(){

    const data =
      JSON.parse(localStorage.getItem("quizAttempts") || "[]");

    if(data.length===0){
        alert("No quiz attempts yet.");
        return;
    }

    let msg = "QUIZ DASHBOARD\n\n";

    const grouped={};

    data.forEach(a=>{
        if(!grouped[a.date]) grouped[a.date]=[];
        grouped[a.date].push(a.score);
    });

    Object.keys(grouped).sort().reverse().forEach(d=>{
        msg += d + "  (" + grouped[d].length + " attempt(s))\n";

        grouped[d].forEach((s,i)=>{
            msg += "   Attempt " + (i+1) +
                   " : " + s + "/30\n";
        });

        msg += "\n";
    });

    alert(msg);
}

/* ===========================
   START QUIZ
=========================== */

answerEl.addEventListener("keydown",function(e){

    if(e.key==="Enter" && !checkBtn.disabled){
        checkAnswer();
    }

});

loadQuestion();

</script>

</body>
</html>
