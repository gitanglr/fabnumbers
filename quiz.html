<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths & English Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e8f4ff,#fff7e6);color:#222;min-height:100vh}
.container{max-width:850px;margin:auto;padding:15px}
.card{background:#fff;border-radius:20px;padding:24px;margin:15px 0;box-shadow:0 5px 20px rgba(0,0,0,.12)}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(27px,6vw,38px);margin:5px 0}.small{color:#666}
.section{display:inline-block;padding:7px 12px;border-radius:20px;background:#eee;font-weight:bold;margin:12px 0}
.progress{font-weight:bold;margin:10px 0 18px}
.question{font-size:clamp(19px,4vw,25px);line-height:1.55;margin:20px 0}
input{width:100%;padding:14px;font-size:20px;border:2px solid #aaa;border-radius:10px;margin:8px 0 12px}
button{border:0;border-radius:10px;padding:13px 20px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px}
.primary{background:#2878d4;color:#fff;width:100%}
.next{background:#333;color:#fff;width:100%}
.dashboard{background:#777;color:#fff}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
.feedback{display:none;margin:16px 0;padding:15px;border-radius:12px;font-size:19px;font-weight:bold}
.correct{background:#e4f8e8;color:#14752c}
.wrong{background:#fff0e8;color:#b23b10}
.score{text-align:center;font-size:32px;font-weight:bold;margin:20px}
.review{padding:14px;margin:12px 0;border-radius:10px;border:1px solid #ddd;line-height:1.5}
.right{background:#f2fff4;border-left:7px solid #28a745}
.incorrect{background:#fff5f5;border-left:7px solid #dc3545}
@media(max-width:600px){.container{padding:8px}.card{padding:18px}}
</style>
</head>
<body>
<div class="container">

<div id="quizScreen" class="card">
<div class="header">
<div>
<h1>🧠 Maths & English Challenge</h1>
<div class="small">20 Questions • Logic + Comprehension</div>
</div>
<button class="dashboard" onclick="goDashboard()">Dashboard</button>
</div>

<div id="section" class="section"></div>
<div id="progress" class="progress"></div>
<div id="question" class="question"></div>

<label><strong>Your answer:</strong></label>
<input id="answer" type="text" placeholder="Type your answer">

<button id="checkBtn" class="primary" onclick="checkAnswer()">Check Answer</button>
<div id="feedback" class="feedback"></div>
<button id="nextBtn" class="next" onclick="nextQuestion()" disabled>Next ➜</button>
</div>

<div id="resultScreen" class="card" style="display:none"></div>
</div>

<script>
const QUESTIONS = [
{type:'number',question:'During a school assembly, 7 classes each line up with 18 students. Five students are absent from the assembly. How many students are actually standing in the lines?',answer:121},
{type:'number',question:'A fruit seller has 84 oranges. He packs them equally into 6 baskets. Before selling them, he adds 3 more oranges to each basket. How many oranges are in each basket now?',answer:17},
{type:'number',question:'Priya saves ₹25 every week. She already has ₹140 saved. How much will she have after saving for 6 more weeks?',answer:290},
{type:'number',question:'A school bus travels 18 km from the school to a sports ground. It makes the same journey back to school. Then it travels another 7 km to a nearby village. How many kilometres does the bus travel altogether?',answer:43},
{type:'number',question:'A box contains red, blue and green marbles. There are 12 red marbles, 8 blue marbles and 15 green marbles. If 5 marbles are taken out without replacing them, how many marbles remain?',answer:30},
{type:'number',question:'A movie at the community hall starts at 3:25 PM and lasts 1 hour 45 minutes. At what time does it finish? Enter as HHMM.',answer:510},
{type:'number',question:'A teacher writes the numbers 2, 5, 8, 11, 14 on the board. Each number is 3 more than the previous one. What is the next number?',answer:17},
{type:'number',question:'A rectangular classroom has 9 rows of chairs with 5 chairs in each row. The teacher removes 7 chairs because they are broken. How many usable chairs remain?',answer:38},
{type:'number',question:'A shop gives ₹20 change from a ₹200 note after a customer buys two identical items. What is the price of each item?',answer:90},
{type:'number',question:'Two angles are complementary, so together they make 90°. One angle is 18° larger than the other. What is the smaller angle?',answer:36},
{type:'text',question:'On the way to school, Aarav noticed that the road near the market was unusually crowded. He later saw a large truck being unloaded there. What most likely caused the extra traffic?',accepted:['the truck was being unloaded', 'a truck was being unloaded', 'the unloading of the truck']},
{type:'text',question:'The science teacher asked the students to bring a transparent bottle for an experiment. Leela brought a metal bottle instead. Which important instruction did Leela not follow?',accepted:['bring a transparent bottle', 'bring a transparent bottle for the experiment', 'use a transparent bottle']},
{type:'text',question:"Dev wanted to buy a new cricket bat, but he first checked the money in his savings box. He decided to wait another month because he did not have enough money. What was Dev's reason for waiting?",accepted:['he did not have enough money', 'he needed more money', 'he had not saved enough money']},
{type:'text',question:'The principal announced that the school playground would be closed during the afternoon because workers were repairing the surface. When could students use the playground again?',accepted:['after the repairs', 'when the repairs were finished', 'after the workers finished repairing it']},
{type:'text',question:'During a group project, four students divided the work. One collected information, another made the drawings, a third wrote the explanation, and the fourth prepared the presentation. Why did they divide the work?',accepted:['to share the work', 'to divide the work among them', 'so each student had a task']},
{type:'text',question:'Ananya put her unfinished art project safely inside her cupboard before leaving home. When she returned, she found it exactly where she had left it. Where had Ananya put her art project?',accepted:['inside her cupboard', 'in her cupboard']},
{type:'text',question:'The teacher gave the class ten minutes to read a passage and then asked questions about it. Rohan read the passage twice before answering. What was Rohan trying to do?',accepted:['understand the passage', 'understand it better', 'make sure he understood the passage']},
{type:'text',question:"A water bottle was found in the school corridor. The name 'Suresh' was written on it. The teacher announced this information so that Suresh could collect it. What was the purpose of writing the name on the bottle?",accepted:['to identify the owner', 'to show who owned the bottle', 'to identify Suresh as the owner']},
{type:'text',question:'Kiran usually cycles to his tuition class. One evening, his bicycle had a flat tyre, so he walked instead. Why did Kiran walk to tuition?',accepted:['his bicycle had a flat tyre', 'because his bicycle had a flat tyre', 'his bicycle tyre was flat']},
{type:'text',question:'The library rules say that students may borrow two books for seven days. Isha borrowed two books on Monday. What is the maximum number of books she can borrow under this rule?',accepted:['two', '2', 'two books']}
];

const STORAGE_KEY="mathsQuizPortalData";
const SESSION_KEY="mathsQuizCurrentUser";

let currentQuestion=0;
let correct=0;
let wrong=0;
let results=[];

function getData(){
    return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
}

function saveData(data){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function getUser(){
    return sessionStorage.getItem(SESSION_KEY);
}

function normalise(text){
    return text.toLowerCase().trim()
        .replace(/[.,!?]/g,"")
        .replace(/\s+/g," ");
}

function showQuestion(){
    const q=QUESTIONS[currentQuestion];

    document.getElementById("section").textContent =
        currentQuestion<10 ? "🔢 Maths & Logic" : "📖 English Comprehension";

    document.getElementById("progress").textContent =
        "Question "+(currentQuestion+1)+" of "+QUESTIONS.length;

    document.getElementById("question").textContent=q.question;

    const box=document.getElementById("answer");
    box.value="";
    box.disabled=false;
    box.type="text";
    box.inputMode=q.type==="number"?"decimal":"text";
    box.placeholder=q.type==="number"
        ?"Type your answer"
        :"Type your answer in words";
    box.focus();

    document.getElementById("checkBtn").disabled=false;
    document.getElementById("nextBtn").disabled=true;

    document.getElementById("nextBtn").textContent =
        currentQuestion===QUESTIONS.length-1
        ?"See Final Result 🏆"
        :"Next ➜";

    const f=document.getElementById("feedback");
    f.style.display="none";
    f.innerHTML="";
    f.className="feedback";
}

function checkAnswer(){
    const box=document.getElementById("answer");
    const typed=box.value.trim();

    if(!typed){
        alert("Please enter your answer first.");
        box.focus();
        return;
    }

    const q=QUESTIONS[currentQuestion];
    let isCorrect=false;

    if(q.type==="number"){
        isCorrect=!Number.isNaN(Number(typed)) &&
                  Number(typed)===q.answer;
    }else{
        const user=normalise(typed);
        isCorrect=q.accepted.some(function(a){
            return user===normalise(a);
        });
    }

    box.disabled=true;
    document.getElementById("checkBtn").disabled=true;

    const f=document.getElementById("feedback");
    f.style.display="block";

    if(isCorrect){
        correct++;
        results.push({answer:typed,correct:true});
        f.className="feedback correct";
        f.innerHTML="🎉 Congratulations! Your answer is correct!";
    }else{
        wrong++;
        results.push({answer:typed,correct:false});
        f.className="feedback wrong";
        f.innerHTML="😊 Better luck next time!";
    }

    document.getElementById("nextBtn").disabled=false;
}

function nextQuestion(){
    if(currentQuestion<QUESTIONS.length-1){
        currentQuestion++;
        showQuestion();
    }else{
        finishQuiz();
    }
}

function finishQuiz(){
    const username=getUser();

    if(!username){
        alert("Your login session has expired. Please log in again.");
        window.location.href="index.html";
        return;
    }

    const data=getData();

    if(!data[username]){
        data[username]={logins:0,quizzes:[]};
    }

    if(!data[username].quizzes){
        data[username].quizzes=[];
    }

    data[username].quizzes.push({
        score:correct,
        correct:correct,
        wrong:wrong,
        total:QUESTIONS.length,
        date:new Date().toLocaleString()
    });

    saveData(data);
    showResult();
}

function correctAnswer(q){
    return q.type==="number" ? String(q.answer) : q.accepted[0];
}

function showResult(){
    document.getElementById("quizScreen").style.display="none";

    const result=document.getElementById("resultScreen");
    result.style.display="block";

    let html=
        "<h2 style='text-align:center'>🏆 Quiz Completed!</h2>"+
        "<div class='score'>Score: "+correct+" / 20</div>"+
        "<p style='text-align:center'>"+
        "✅ Correct: <strong>"+correct+"</strong> &nbsp;&nbsp;"+
        "❌ Wrong: <strong>"+wrong+"</strong>"+
        "</p><hr>"+
        "<h3>📋 Final Question Review</h3>"+
        "<p><em>Correct answers are shown only here, after the quiz is completed.</em></p>";

    QUESTIONS.forEach(function(q,index){
        const r=results[index];

        html+=
            "<div class='review "+(r.correct?"right":"incorrect")+"'>"+
            "<strong>Question "+(index+1)+"</strong> — "+
            (index<10?"Maths & Logic":"English Comprehension")+
            "<br><br>"+escapeHtml(q.question)+
            "<br><br>Your answer: <strong>"+
            escapeHtml(r.answer)+
            "</strong><br>Correct answer: <strong>"+
            escapeHtml(correctAnswer(q))+
            "</strong><br>"+
            (r.correct?"✅ Correct":"❌ Wrong")+
            "</div>";
    });

    html+="<button class='primary' onclick='goDashboard()'>📊 Back to Dashboard</button>";

    result.innerHTML=html;

    window.scrollTo({top:0,behavior:"smooth"});
}

function escapeHtml(text){
    const div=document.createElement("div");
    div.textContent=text;
    return div.innerHTML;
}

function goDashboard(){
    window.location.href="index.html";
}

document.getElementById("answer").addEventListener("keydown",function(e){
    if(e.key==="Enter" &&
       !document.getElementById("checkBtn").disabled){
        checkAnswer();
    }
});

if(!getUser()){
    alert("Please log in first.");
    window.location.href="index.html";
}else{
    showQuestion();
}
</script>
</body>
</html>
