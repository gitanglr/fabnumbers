<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's 30 Question Challenge</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#eef6ff;margin:0;padding:20px}
.card{max-width:900px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
h1{margin:0;color:#1d4ed8}.sub{color:#555;margin-bottom:20px}
#section{font-weight:bold;color:#1d4ed8;font-size:18px}
#progress{color:#666;margin:8px 0 18px}
#question{font-size:23px;line-height:1.6;margin:20px 0}
input{width:100%;padding:14px;font-size:18px;border:2px solid #ccc;border-radius:10px}
button{width:100%;padding:14px;font-size:17px;border:none;border-radius:10px;margin-top:12px;cursor:pointer;font-weight:bold}
#checkBtn{background:#2563eb;color:white}#nextBtn{background:#333;color:white}button:disabled{opacity:.5;cursor:not-allowed}
#feedback{display:none;padding:14px;border-radius:10px;margin-top:14px;font-weight:bold;font-size:18px}.correct{background:#dcfce7;color:#166534}.wrong{background:#fee2e2;color:#991b1b}
.review{border:1px solid #ddd;border-radius:10px;padding:12px;margin:12px 0}.right{border-left:6px solid #22c55e}.bad{border-left:6px solid #ef4444}.score{font-size:34px;text-align:center;color:#1d4ed8;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div id="quiz">
<h1>🧠 Today's 30 Question Challenge</h1>
<div class="sub">10 Maths • 10 Reading Comprehension • 10 Vocabulary</div>
<div id="section"></div><div id="progress"></div><div id="question"></div>
<input id="answer" placeholder="Type your answer here">
<button id="checkBtn">Check Answer</button>
<div id="feedback"></div>
<button id="nextBtn" disabled>Next</button>
</div>
<div id="result" style="display:none"></div>
</div>
<script>
const questions=[
{type:'number',q:'A school buys 15 packets of chalk. Each packet has 28 sticks. Teachers use 84 sticks. The remaining chalk is shared equally among 6 classrooms. How many sticks does each classroom receive?',a:'56'},
{type:'number',q:'A bus starts with 42 passengers. At Stop A, 15 get off and 18 get on. At Stop B, 9 get off and 7 get on. How many passengers are now on the bus?',a:'43'},
{type:'number',q:'Riya has ₹1200. She buys a school bag for ₹465 and 3 notebooks costing ₹58 each. How much money is left?',a:'561'},
{type:'number',q:'A water tank contains 850 litres. 275 litres are used. Later, 180 litres are added. How many litres are now in the tank?',a:'755'},
{type:'number',q:'Find the missing number: 11, 18, 29, 44, 63, ?',a:'86'},
{type:'number',q:'The perimeter of a rectangle is 96 m. Its length is 29 m. Find its width.',a:'19'},
{type:'number',q:'A cricket team scores 96 runs in 12 overs and 84 runs in the last 8 overs. What is the average runs per over?',a:'9'},
{type:'number',q:'A shop offers a 25% discount on a helmet costing ₹640. How much does the customer pay?',a:'480'},
{type:'number',q:'Three equal angles and one angle of 48° make 360°. Find each equal angle.',a:'104'},
{type:'number',q:'A baker makes 216 cookies and packs them equally into 9 boxes. Two boxes are sold. How many cookies remain?',a:'168'},
{type:'text',q:'Students participating in the debate competition must report to Room 14 by 8:20 AM. Where should they report?',a:'room 14'},
{type:'text',q:'Arjun watered the plants every evening because his grandparents were away. Why did he water the plants?',a:'to take care of the plants'},
{type:'text',q:'The librarian wanted books returned before Friday. Why?',a:'so they could be counted'},
{type:'text',q:'The football match was postponed because lightning was seen. Why?',a:'because of lightning'},
{type:'text',q:'Maya completed her homework before watching television. What did she do first?',a:'homework'},
{type:'text',q:'Science models must be labelled with the student name and class. What must every model have?',a:'student name and class'},
{type:'text',q:'Kiran reached the station 20 minutes early. Why did he have enough time?',a:'he reached early'},
{type:'text',q:'The teacher divided the class into groups of four. Why?',a:'so everyone could participate'},
{type:'text',q:'A museum sign said photography is not allowed. What activity was not allowed?',a:'photography'},
{type:'text',q:'The class collected newspapers to make paper bags. Why?',a:'to recycle them'},
{type:'text',q:'A person who writes books is called an ______.',a:'author'},
{type:'text',q:'The opposite of borrow is ______.',a:'lend'},
{type:'text',q:'A scientist who studies earthquakes is a ______.',a:'seismologist'},
{type:'text',q:'To speak very softly is to ______.',a:'whisper'},
{type:'text',q:'A journey made for pleasure is called a ______.',a:'tour'},
{type:'text',q:'Something that can be trusted because it works correctly is ______.',a:'reliable'},
{type:'text',q:'A person who flies an aeroplane is a ______.',a:'pilot'},
{type:'text',q:'A person who spends money carefully is ______.',a:'thrifty'},
{type:'text',q:'To examine something very carefully is to ______.',a:'inspect'},
{type:'text',q:'A doctor who treats animals is a ______.',a:'veterinarian'}
];
let current=0,score=0,answers=[];const section=document.getElementById('section');const progress=document.getElementById('progress');const question=document.getElementById('question');const answer=document.getElementById('answer');const feedback=document.getElementById('feedback');const checkBtn=document.getElementById('checkBtn');const nextBtn=document.getElementById('nextBtn');
function norm(s){return s.toLowerCase().trim().replace(/[.,!?]/g,'').replace(/\s+/g,' ')}
function showQuestion(){const q=questions[current];section.textContent=current<10?'🔢 Maths & Logical Reasoning':current<20?'📖 Reading Comprehension':'📚 Vocabulary';progress.textContent='Question '+(current+1)+' of 30';question.textContent=q.q;answer.value='';answer.disabled=false;checkBtn.disabled=false;nextBtn.disabled=true;feedback.style.display='none';nextBtn.textContent=current===29?'Finish Quiz':'Next';answer.focus()}
function checkAnswer(){const user=answer.value.trim();if(user===''){alert('Please enter an answer.');return}const q=questions[current];const correct=q.type==='number'?user===q.a:norm(user)===norm(q.a);answers.push({user,correct});answer.disabled=true;checkBtn.disabled=true;feedback.style.display='block';if(correct){score++;feedback.className='correct';feedback.textContent='🎉 Congratulations! Your answer is correct.'}else{feedback.className='wrong';feedback.textContent='😊 Better luck next time!'}nextBtn.disabled=false}
function nextQuestion(){if(current<29){current++;showQuestion()}else{showResult()}}
function showResult(){document.getElementById('quiz').style.display='none';const result=document.getElementById('result');result.style.display='block';let html='<h2 style="text-align:center">🏆 Quiz Complete!</h2>';html+='<div class="score">'+score+' / 30</div>';html+='<h3>Final Review</h3>';questions.forEach((q,i)=>{const r=answers[i];html+='<div class="review '+(r.correct?'right':'bad')+'">';html+='<b>Question '+(i+1)+'</b><br><br>';html+=q.q+'<br><br>';html+='Your answer: <b>'+r.user+'</b><br>';html+='Correct answer: <b>'+q.a+'</b><br>';html+=r.correct?'✅ Correct':'❌ Wrong';html+='</div>'});result.innerHTML=html}
checkBtn.onclick=checkAnswer;nextBtn.onclick=nextQuestion;answer.addEventListener('keydown',function(e){if(e.key==='Enter'&&!checkBtn.disabled)checkAnswer()});showQuestion();
</script>
</body>
</html>
