<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Quiz</title><style>body{font-family:Arial;background:#eef6ff;margin:0}.c{max-width:850px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px #0002}button,input{width:100%;padding:12px;margin-top:10px;font-size:18px}.fb{display:none;padding:12px;border-radius:8px;margin:10px 0}.ok{background:#dff5e3}.bad{background:#fde7e7}.rev{border:1px solid #ddd;padding:10px;margin:10px 0}</style></head><body><div class='c'><div id='q' class='card'><h2>🧠 Maths & English Challenge</h2><div id='sec'></div><div id='p'></div><div id='ques'></div><input id='ans'><button id='chk' onclick='check()'>Check Answer</button><div id='fb' class='fb'></div><button id='nxt' onclick='nextQ()' disabled>Next</button></div><div id='res' class='card' style='display:none'></div></div><script>const Q=[{"type": "number", "question": "A school has 8 classrooms. Each classroom has 24 desks. During an examination, 17 desks are not used. How many desks are being used?", "answer": 175}, {"type": "number", "question": "A vegetable vendor has 125 tomatoes. He puts 15 tomatoes aside for a restaurant and packs the rest equally into 5 crates. How many tomatoes are in each crate?", "answer": 22}, {"type": "number", "question": "Rohan has ₹500. He buys a geometry box for ₹145 and three pens costing ₹35 each. How much money does he have left?", "answer": 250}, {"type": "number", "question": "A train leaves Bengaluru at 6:45 AM and reaches Mysuru at 9:15 AM. How long is the journey? Give the answer in minutes.", "answer": 150}, {"type": "number", "question": "A number is multiplied by 4 and then 9 is subtracted. The result is 31. What is the number?", "answer": 10}, {"type": "number", "question": "A rectangular notice board is 10 metres long and 4 metres wide. A teacher wants to put a border around the entire board. How many metres of border are needed?", "answer": 28}, {"type": "number", "question": "A class collects 15 kg of old newspapers on Monday, 18 kg on Tuesday and 12 kg on Wednesday. They pack the newspapers into bags of 5 kg each. How many full bags can they make?", "answer": 9}, {"type": "number", "question": "A water tank contains 600 litres. In the morning, 175 litres are used. In the afternoon, twice as much water as was used in the morning is added to the tank. How many litres are in the tank then?", "answer": 775}, {"type": "number", "question": "A sequence begins 4, 7, 13, 22, 34. The amount added each time increases by 3. What is the next number?", "answer": 49}, {"type": "number", "question": "An angle measures 72°. A second angle is half of the first angle. A third angle is the remaining angle needed to make all three angles total 180°. What is the third angle?", "answer": 72}, {"type": "text", "question": "The school gardener planted new saplings near the entrance. He placed small sticks beside them and tied the plants gently to the sticks. Why did he use the sticks?", "accepted": ["to support the young plants", "to support the plants", "to help the young plants stand upright"]}, {"type": "text", "question": "The teacher announced that the art room would be available only after lunch because it was being cleaned in the morning. When could students use the art room?", "accepted": ["after lunch", "after lunchtime", "in the afternoon after lunch"]}, {"type": "text", "question": "Nisha noticed that her younger brother had left his lunch box at home. She took it to his school before his lunch break. Why did Nisha take the lunch box to school?", "accepted": ["because her brother had left it at home", "so her brother could have his lunch", "because her brother forgot his lunch box"]}, {"type": "text", "question": "A library book was due on Friday. On Thursday evening, Sameer put the book into his school bag so that he would remember to return it the next day. What was Sameer preparing to do?", "accepted": ["return the library book", "return the book", "take the book back to the library"]}, {"type": "text", "question": "The class was going on a nature walk. The teacher told everyone to wear comfortable shoes and carry a water bottle. Why were these instructions given?", "accepted": ["to prepare students for the nature walk", "because they would be walking outdoors", "to make the walk comfortable and safe"]}, {"type": "text", "question": "Pooja opened her notebook and saw that the last two pages were blank. She decided to use those pages for rough work instead of starting a new notebook. What did Pooja decide to use the blank pages for?", "accepted": ["rough work", "doing rough work"]}, {"type": "text", "question": "The school bus could not use its usual road because a bridge was being repaired. The driver took another road and reached school ten minutes late. Why was the bus late?", "accepted": ["because the bridge was being repaired", "because the usual road was closed", "because the bus had to take another road"]}, {"type": "text", "question": "During a group discussion, everyone listened while Farhan explained his idea. After he finished, the other students asked questions. What happened after Farhan explained his idea?", "accepted": ["the other students asked questions", "students asked questions", "the other students questioned him"]}, {"type": "text", "question": "Mina wanted to make a birthday card for her cousin. She chose coloured paper, scissors and glue from her craft box. What was Mina planning to make?", "accepted": ["a birthday card", "a card for her cousin"]}, {"type": "text", "question": "The notice outside the computer room said, 'Please switch off the monitor before leaving.' What should a student do before leaving the room?", "accepted": ["switch off the monitor", "turn off the monitor"]}];let i=0,c=0,w=0,R=[];const sec=document.getElementById('sec'),p=document.getElementById('p'),ques=document.getElementById('ques'),ans=document.getElementById('ans'),chk=document.getElementById('chk'),fb=document.getElementById('fb'),nxt=document.getElementById('nxt'),qdiv=document.getElementById('q'),res=document.getElementById('res');function norm(t){return t.toLowerCase().trim().replace(/[.,!?]/g,'').replace(/\s+/g,' ')}function show(){let q=Q[i];sec.textContent=i<10?'🔢 Maths & Logic':'📖 English';p.textContent='Question '+(i+1)+' of 20';ques.textContent=q.question;ans.value='';ans.disabled=false;chk.disabled=false;nxt.disabled=true;fb.style.display='none';fb.className='fb';nxt.textContent=i===19?'Finish Quiz':'Next';ans.focus();}function check(){let t=ans.value.trim();if(!t)return;let q=Q[i],ok=false;if(q.type==='number')ok=Number(t)===q.answer;else ok=q.accepted.some(a=>norm(a)===norm(t));ans.disabled=true;chk.disabled=true;fb.style.display='block';if(ok){c++;R.push({a:t,o:true});fb.className='fb ok';fb.textContent='🎉 Congratulations! Your answer is correct!';}else{w++;R.push({a:t,o:false});fb.className='fb bad';fb.textContent='😊 Better luck next time!';}nxt.disabled=false;}function nextQ(){if(i<19){i++;show();}else finish();}function finish(){qdiv.style.display='none';res.style.display='block';let h='<h2>🏆 Score: '+c+'/20</h2><p>Correct: '+c+' | Wrong: '+w+'</p>';Q.forEach((q,n)=>{let ca=q.type==='number'?q.answer:q.accepted[0];h+='<div class=rev><b>Q'+(n+1)+'</b><br>'+q.question+'<br><br>Your answer: <b>'+R[n].a+'</b><br>Correct answer: <b>'+ca+'</b><br>'+(R[n].o?'✅ Correct':'❌ Wrong')+'</div>';});res.innerHTML=h;}ans.addEventListener('keydown',e=>{if(e.key==='Enter'&&!chk.disabled)check();});show();</script></body></html>
