<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths & English Challenge</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e8f4ff,#fff7e6);color:#222;min-height:100vh}
.container{max-width:850px;margin:auto;padding:15px}
.card{background:#fff;border-radius:20px;padding:24px;margin:15px 0;box-shadow:0 5px 20px rgba(0,0,0,.12)}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(27px,6vw,38px);margin:5px 0}.small{color:#666}
.section{display:inline-block;padding:7px 12px;border-radius:20px;background:#eee;font-weight:bold;margin:12px 0}
.progress{font-weight:bold;margin:10px 0 18px}
.question{font-size:clamp(19px,4vw,25px);line-height:1.55;margin:20px 0}
input{width:100%;padding:14px;font-size:20px;border:2px solid #aaa;border-radius:10px;margin:8px 0 12px}
button{border:0;border-radius:10px;padding:13px 20px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px}
.primary{background:#2878d4;color:#fff;width:100%}
.next{background:#333;color:#fff;width:100%}
.dashboard{background:#777;color:#fff}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
.feedback{display:none;margin:16px 0;padding:15px;border-radius:12px;font-size:19px;font-weight:bold}
.correct{background:#e4f8e8;color:#14752c}
.wrong{background:#fff0e8;color:#b23b10}
.score{text-align:center;font-size:32px;font-weight:bold;margin:20px}
.review{padding:14px;margin:12px 0;border-radius:10px;border:1px solid #ddd;line-height:1.5}
.right{background:#f2fff4;border-left:7px solid #28a745}
.incorrect{background:#fff5f5;border-left:7px solid #dc3545}
@media(max-width:600px){.container{padding:8px}.card{padding:18px}}
</style>
</head>
<body>
<div class="container">

<div id="quizScreen" class="card">
<div class="header">
<div>
<h1>🧠 Maths & English Challenge</h1>
<div class="small">20 Questions • Logic + Comprehension</div>
</div>
<button class="dashboard" onclick="goDashboard()">Dashboard</button>
</div>

<div id="section" class="section"></div>
<div id="progress" class="progress"></div>
<div id="question" class="question"></div>

<label><strong>Your answer:</strong></label>
<input id="answer" type="text" placeholder="Type your answer">

<button id="checkBtn" class="primary" onclick="checkAnswer()">Check Answer</button>
<div id="feedback" class="feedback"></div>
<button id="nextBtn" class="next" onclick="nextQuestion()" disabled>Next ➜</button>
</div>

<div id="resultScreen" class="card" style="display:none"></div>
</div>

<script>
const QUESTIONS = [

/* ===========================
   1–10 Maths & Logic
=========================== */

{type:'number',question:'A school buys 15 packets of chalk. Each packet has 28 sticks. Teachers use 84 sticks. The remaining chalk is shared equally among 6 classrooms. How many sticks does each classroom receive?',answer:56},

{type:'number',question:'A bus starts with 42 passengers. At Stop A, 15 get off and 18 get on. At Stop B, 9 get off and 7 get on. How many passengers are now on the bus?',answer:43},

{type:'number',question:'Riya has ₹1200. She buys a school bag for ₹465 and 3 notebooks costing ₹58 each. How much money is left?',answer:561},

{type:'number',question:'A water tank contains 850 litres. 275 litres are used. Later, 180 litres are added. How many litres are now in the tank?',answer:755},

{type:'number',question:'Find the missing number: 11, 18, 29, 44, 63, ?',answer:86},

{type:'number',question:'The perimeter of a rectangle is 96 m. Its length is 29 m. Find its width.',answer:19},

{type:'number',question:'A cricket team scores 96 runs in the first 12 overs and 84 runs in the last 8 overs. What is the average runs per over for the entire innings?',answer:9},

{type:'number',question:'A shop offers a 25% discount on a helmet costing ₹640. How much does the customer pay?',answer:480},

{type:'number',question:'Three equal angles and one angle of 48° make 360°. Find each equal angle.',answer:104},

{type:'number',question:'A baker makes 216 cookies and packs them equally into 9 boxes. Two boxes are sold. How many cookies remain?',answer:168},

/* ===========================
   11–20 Reading Comprehension
=========================== */

{type:'text',question:'Students participating in the debate competition must report to Room 14 by 8:20 AM. Where should they report?',accepted:['room 14']},

{type:'text',question:'Arjun watered the plants every evening because his grandparents were away. Why did he water the plants?',accepted:['to take care of the plants']},

{type:'text',question:'The librarian wanted books returned before Friday. Why?',accepted:['so they could be counted']},

{type:'text',question:'The football match was postponed because lightning was seen. Why?',accepted:['because of lightning']},

{type:'text',question:'Maya completed her homework before watching television. What did she do first?',accepted:['homework']},

{type:'text',question:'Science models must be labelled with the student name and class. What must every model have?',accepted:['student name and class']},

{type:'text',question:'Kiran reached the station 20 minutes early. Why did he have enough time?',accepted:['he reached early']},

{type:'text',question:'The teacher divided the class into groups of four. Why?',accepted:['so everyone could participate']},

{type:'text',question:'A museum sign said photography is not allowed. What activity was not allowed?',accepted:['photography']},

{type:'text',question:'The class collected newspapers to make paper bags. Why?',accepted:['to recycle them']},

/* ===========================
   21–30 Vocabulary
=========================== */

{type:'text',question:'A person who writes books is called an ______.',accepted:['author']},

{type:'text',question:'The opposite of borrow is ______.',accepted:['lend']},

{type:'text',question:'A scientist who studies earthquakes is a ______.',accepted:['seismologist']},

{type:'text',question:'To speak very softly is to ______.',accepted:['whisper']},

{type:'text',question:'A journey made for pleasure is called a ______.',accepted:['tour']},

{type:'text',question:'Something that can be trusted because it works correctly is ______.',accepted:['reliable']},

{type:'text',question:'A person who flies an aeroplane is a ______.',accepted:['pilot']},

{type:'text',question:'A person who spends money carefully is ______.',accepted:['thrifty']},

{type:'text',question:'To examine something very carefully is to ______.',accepted:['inspect']},

{type:'text',question:'A doctor who treats animals is a ______.',accepted:['veterinarian']}

];

const STORAGE_KEY="mathsQuizPortalData";
const SESSION_KEY="mathsQuizCurrentUser";

let currentQuestion=0;
let correct=0;
let wrong=0;
let results=[];

function getData(){
    return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
}

function saveData(data){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function getUser(){
    return sessionStorage.getItem(SESSION_KEY);
}

function normalise(text){
    return text.toLowerCase().trim()
        .replace(/[.,!?]/g,"")
        .replace(/\s+/g," ");
}

function showQuestion(){
    const q=QUESTIONS[currentQuestion];

    document.getElementById("section").textContent =
currentQuestion<10
 ? "🔢 Maths & Logic"
 : currentQuestion<20
 ? "📖 English Comprehension"
 : "📚 Vocabulary";

    document.getElementById("progress").textContent =
        "Question "+(currentQuestion+1)+" of "+QUESTIONS.length;

    document.getElementById("question").textContent=q.question;

    const box=document.getElementById("answer");
    box.value="";
    box.disabled=false;
    box.type="text";
    box.inputMode=q.type==="number"?"decimal":"text";
    box.placeholder=q.type==="number"
        ?"Type your answer"
        :"Type your answer in words";
    box.focus();

    document.getElementById("checkBtn").disabled=false;
    document.getElementById("nextBtn").disabled=true;

    document.getElementById("nextBtn").textContent =
        currentQuestion===QUESTIONS.length-1
        ?"See Final Result 🏆"
        :"Next ➜";

    const f=document.getElementById("feedback");
    f.style.display="none";
    f.innerHTML="";
    f.className="feedback";
}

function checkAnswer(){
    const box=document.getElementById("answer");
    const typed=box.value.trim();

    if(!typed){
        alert("Please enter your answer first.");
        box.focus();
        return;
    }

    const q=QUESTIONS[currentQuestion];
    let isCorrect=false;

    if(q.type==="number"){
        isCorrect=!Number.isNaN(Number(typed)) &&
                  Number(typed)===q.answer;
    }else{
        const user=normalise(typed);
        isCorrect=q.accepted.some(function(a){
            return user===normalise(a);
        });
    }

    box.disabled=true;
    document.getElementById("checkBtn").disabled=true;

    const f=document.getElementById("feedback");
    f.style.display="block";

    if(isCorrect){
        correct++;
        results.push({answer:typed,correct:true});
        f.className="feedback correct";
        f.innerHTML="🎉 Congratulations! Your answer is correct!";
    }else{
        wrong++;
        results.push({answer:typed,correct:false});
        f.className="feedback wrong";
        f.innerHTML="😊 Better luck next time!";
    }

    document.getElementById("nextBtn").disabled=false;
}

function nextQuestion(){
    if(currentQuestion<QUESTIONS.length-1){
        currentQuestion++;
        showQuestion();
    }else{
        finishQuiz();
    }
}

function finishQuiz(){
    const username=getUser();

    if(!username){
        alert("Your login session has expired. Please log in again.");
        window.location.href="index.html";
        return;
    }

    const data=getData();

    if(!data[username]){
        data[username]={logins:0,quizzes:[]};
    }

    if(!data[username].quizzes){
        data[username].quizzes=[];
    }

    data[username].quizzes.push({
        score:correct,
        correct:correct,
        wrong:wrong,
        total:QUESTIONS.length,
        date:new Date().toLocaleString()
    });

    saveData(data);
    showResult();
}

function correctAnswer(q){
    return q.type==="number" ? String(q.answer) : q.accepted[0];
}

function showResult(){
    document.getElementById("quizScreen").style.display="none";

    const result=document.getElementById("resultScreen");
    result.style.display="block";

    let html=
        "<h2 style='text-align:center'>🏆 Quiz Completed!</h2>"+
        "<div class='score'>Score: "+correct+" / 20</div>"+
        "<p style='text-align:center'>"+
        "✅ Correct: <strong>"+correct+"</strong> &nbsp;&nbsp;"+
        "❌ Wrong: <strong>"+wrong+"</strong>"+
        "</p><hr>"+
        "<h3>📋 Final Question Review</h3>"+
        "<p><em>Correct answers are shown only here, after the quiz is completed.</em></p>";

    QUESTIONS.forEach(function(q,index){
        const r=results[index];

        html+=
            "<div class='review "+(r.correct?"right":"incorrect")+"'>"+
            "<strong>Question "+(index+1)+"</strong> — "+
            (index<10
 ? "Maths & Logic"
 : index<20
 ? "English Comprehension"
 : "Vocabulary")+
            "<br><br>"+escapeHtml(q.question)+
            "<br><br>Your answer: <strong>"+
            escapeHtml(r.answer)+
            "</strong><br>Correct answer: <strong>"+
            escapeHtml(correctAnswer(q))+
            "</strong><br>"+
            (r.correct?"✅ Correct":"❌ Wrong")+
            "</div>";
    });

    html+="<button class='primary' onclick='goDashboard()'>📊 Back to Dashboard</button>";

    result.innerHTML=html;

    window.scrollTo({top:0,behavior:"smooth"});
}

function escapeHtml(text){
    const div=document.createElement("div");
    div.textContent=text;
    return div.innerHTML;
}

function goDashboard(){
    window.location.href="index.html";
}

document.getElementById("answer").addEventListener("keydown",function(e){
    if(e.key==="Enter" &&
       !document.getElementById("checkBtn").disabled){
        checkAnswer();
    }
});

if(!getUser()){
    alert("Please log in first.");
    window.location.href="index.html";
}else{
    showQuestion();
}
</script>
</body>
</html>
