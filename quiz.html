<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Daily Quiz - 80 Questions</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#222}.container{max-width:850px;margin:30px auto;padding:15px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 5px 20px rgba(0,0,0,.1)}h1{text-align:center;color:#2457a6;margin-top:0}#section{font-weight:bold;color:#555;font-size:18px}#progress{margin:8px 0 22px;color:#777}#question{font-size:23px;font-weight:bold;line-height:1.5;margin-bottom:22px}#answer{width:100%;padding:14px;font-size:20px;border:2px solid #bbb;border-radius:8px}button{padding:12px 20px;font-size:17px;border:0;border-radius:8px;cursor:pointer;margin-top:14px}#checkBtn{background:#2457a6;color:#fff}#nextBtn{background:#2e8b57;color:#fff;margin-left:8px}button:disabled{opacity:.5;cursor:not-allowed}#feedback{font-size:19px;font-weight:bold;min-height:30px;margin-top:15px}.correct{color:#16833b}.wrong{color:#c62828}.jump{margin-top:22px;padding-top:18px;border-top:1px solid #ddd;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.jump input{width:90px;padding:10px;font-size:17px;border:1px solid #aaa;border-radius:7px}.jump button{margin-top:0;background:#555;color:#fff}.result-row{padding:12px;border-bottom:1px solid #ddd}.correct-answer{color:#16833b;font-weight:bold}.user-answer{font-weight:bold}.score{font-size:25px;font-weight:bold;text-align:center;margin:20px}.summary{background:#f7f9fc;padding:15px;border-radius:10px;margin:10px 0}.dashboard-btn{background:#777;color:#fff}@media(max-width:600px){.card{padding:18px}#question{font-size:20px}}
</style></head><body><div class="container">
<div id="quizScreen" class="card"><h1>Daily Quiz</h1><div id="section"></div><div id="progress"></div><div id="question"></div><input id="answer" type="text" placeholder="Type your answer here"><br><button id="checkBtn" onclick="checkAnswer()">Check Answer</button><button id="nextBtn" onclick="nextQuestion()" disabled>Next</button><div id="feedback"></div><div class="jump"><label for="jumpInput"><b>Go to question:</b></label><input id="jumpInput" type="number" min="1" max="80" placeholder="1-80"><button onclick="goToQuestion()">Go</button></div></div>
<div id="resultScreen" class="card" style="display:none"></div></div>
<script>
const QUESTIONS=[
{section:"Maths & Logical Reasoning",q:"A shop has 18 boxes. Each box contains 24 chocolates. If 156 chocolates are sold, how many chocolates are left?",a:"276"},
{section:"Maths & Logical Reasoning",q:"A train has 168 passengers in one coach and 132 passengers in another coach. How many passengers are there altogether?",a:"300"},
{section:"Maths & Logical Reasoning",q:"A farmer plants 25 rows of mango trees. Each row has 96 trees. How many mango trees are there?",a:"2400"},
{section:"Maths & Logical Reasoning",q:"A rectangular garden is 18 metres long and 12 metres wide. What is its perimeter?",a:"60"},
{section:"Maths & Logical Reasoning",q:"Find the next number: 8, 17, 35, 71, ?",a:"143"},
{section:"Maths & Logical Reasoning",q:"Ravi has ₹2,450 and receives another ₹875. How much money does he have now?",a:"3325"},
{section:"Maths & Logical Reasoning",q:"Two angles of a triangle are 56° and 49°. What is the third angle?",a:"75"},
{section:"Maths & Logical Reasoning",q:"A tank contains 950 litres of water. If 285 litres are used, how many litres remain?",a:"665"},
{section:"Maths & Logical Reasoning",q:"There are 18 classrooms with 32 students in each classroom. How many students are there altogether?",a:"576"},
{section:"Maths & Logical Reasoning",q:"A cricket player scores 45, 62, 51 and 58 runs in four matches. What is his average score?",a:"54"},
{section:"English Grammar",q:"She bought ___ orange from the shop.",a:"an"},{section:"English Grammar",q:"The baby ___ sleeping now.",a:"is"},{section:"English Grammar",q:"Birds fly ___ the sky.",a:"in"},{section:"English Grammar",q:"Please sit ___ your chair.",a:"on"},{section:"English Grammar",q:"Water ___ at 100°C.",a:"boils"},{section:"English Grammar",q:"This is ___ pencil. It belongs to me.",a:"my"},{section:"English Grammar",q:"Ravi and I are friends. ___ play football together.",a:"we"},{section:"English Grammar",q:"You ___ wear a seat belt while driving.",a:"must"},{section:"English Grammar",q:"The teacher asked us ___ listen carefully.",a:"to"},{section:"English Grammar",q:"I was tired, ___ I went to bed early.",a:"so"},
{section:"One-word Vocabulary",q:"What is the one word for a person who designs buildings?",a:"architect"},{section:"One-word Vocabulary",q:"What is the one word for a book containing maps?",a:"atlas"},{section:"One-word Vocabulary",q:"What is the one word for a person who repairs shoes?",a:"cobbler"},{section:"One-word Vocabulary",q:"What is the one word for a doctor who treats animals?",a:"veterinarian"},{section:"One-word Vocabulary",q:"What is the one word for a person who grows crops?",a:"farmer"},{section:"One-word Vocabulary",q:"What is the one word for a person who writes books?",a:"author"},{section:"One-word Vocabulary",q:"What is the one word for a person who cuts men's hair?",a:"barber"},{section:"One-word Vocabulary",q:"What is the one word for a scientist who studies stars?",a:"astronomer"},{section:"One-word Vocabulary",q:"What is the one word for a person who paints pictures?",a:"artist"},{section:"One-word Vocabulary",q:"What is the one word for a person who flies an aeroplane?",a:"pilot"},
{section:"Speed Maths",q:"27 + 15 = ?",a:"42"},{section:"Speed Maths",q:"48 + 36 = ?",a:"84"},{section:"Speed Maths",q:"125 + 74 = ?",a:"199"},{section:"Speed Maths",q:"69 + 28 = ?",a:"97"},{section:"Speed Maths",q:"144 + 56 = ?",a:"200"},{section:"Speed Maths",q:"215 + 89 = ?",a:"304"},{section:"Speed Maths",q:"38 + 47 = ?",a:"85"},{section:"Speed Maths",q:"92 + 18 = ?",a:"110"},{section:"Speed Maths",q:"173 + 26 = ?",a:"199"},{section:"Speed Maths",q:"56 + 39 = ?",a:"95"},{section:"Speed Maths",q:"84 + 17 = ?",a:"101"},{section:"Speed Maths",q:"305 + 44 = ?",a:"349"},{section:"Speed Maths",q:"199 + 101 = ?",a:"300"},
{section:"Speed Maths",q:"18 - 9 = ?",a:"9"},{section:"Speed Maths",q:"45 - 17 = ?",a:"28"},{section:"Speed Maths",q:"99 - 29 = ?",a:"70"},{section:"Speed Maths",q:"120 - 38 = ?",a:"82"},{section:"Speed Maths",q:"250 - 95 = ?",a:"155"},{section:"Speed Maths",q:"86 - 48 = ?",a:"38"},{section:"Speed Maths",q:"500 - 175 = ?",a:"325"},{section:"Speed Maths",q:"63 - 27 = ?",a:"36"},{section:"Speed Maths",q:"340 - 160 = ?",a:"180"},{section:"Speed Maths",q:"91 - 56 = ?",a:"35"},{section:"Speed Maths",q:"800 - 275 = ?",a:"525"},{section:"Speed Maths",q:"72 - 19 = ?",a:"53"},{section:"Speed Maths",q:"150 - 68 = ?",a:"82"},
{section:"Speed Maths",q:"6 × 8 = ?",a:"48"},{section:"Speed Maths",q:"7 × 9 = ?",a:"63"},{section:"Speed Maths",q:"12 × 11 = ?",a:"132"},{section:"Speed Maths",q:"15 × 6 = ?",a:"90"},{section:"Speed Maths",q:"14 × 8 = ?",a:"112"},{section:"Speed Maths",q:"13 × 7 = ?",a:"91"},{section:"Speed Maths",q:"9 × 12 = ?",a:"108"},{section:"Speed Maths",q:"16 × 5 = ?",a:"80"},{section:"Speed Maths",q:"18 × 4 = ?",a:"72"},{section:"Speed Maths",q:"25 × 8 = ?",a:"200"},{section:"Speed Maths",q:"17 × 3 = ?",a:"51"},{section:"Speed Maths",q:"19 × 6 = ?",a:"114"},
{section:"Speed Maths",q:"26 ÷ 2 = ?",a:"13"},{section:"Speed Maths",q:"99 ÷ 3 = ?",a:"33"},{section:"Speed Maths",q:"144 ÷ 12 = ?",a:"12"},{section:"Speed Maths",q:"84 ÷ 7 = ?",a:"12"},{section:"Speed Maths",q:"96 ÷ 8 = ?",a:"12"},{section:"Speed Maths",q:"120 ÷ 10 = ?",a:"12"},{section:"Speed Maths",q:"180 ÷ 9 = ?",a:"20"},{section:"Speed Maths",q:"132 ÷ 11 = ?",a:"12"},{section:"Speed Maths",q:"72 ÷ 6 = ?",a:"12"},{section:"Speed Maths",q:"225 ÷ 15 = ?",a:"15"},{section:"Speed Maths",q:"156 ÷ 12 = ?",a:"13"},{section:"Speed Maths",q:"240 ÷ 8 = ?",a:"30"}
];
let current=0,userAnswers=Array(QUESTIONS.length).fill(""),answered=Array(QUESTIONS.length).fill(false),correctFlags=Array(QUESTIONS.length).fill(false);
function normalize(v){return v.trim().toLowerCase().replace(/\s+/g," ")}
function loadQuestion(){let x=QUESTIONS[current],a=document.getElementById("answer"),f=document.getElementById("feedback");document.getElementById("section").textContent=x.section;document.getElementById("progress").textContent="Question "+(current+1)+" of "+QUESTIONS.length;document.getElementById("question").textContent=x.q;a.value=userAnswers[current];f.textContent="";f.className="";a.disabled=answered[current];document.getElementById("checkBtn").disabled=answered[current];document.getElementById("nextBtn").disabled=!answered[current];if(answered[current]){f.textContent=correctFlags[current]?"Correct! Well done!":"Better luck next time!";f.className=correctFlags[current]?"correct":"wrong"}a.focus()}
function checkAnswer(){if(answered[current])return;let a=document.getElementById("answer"),v=a.value.trim();if(!v){alert("Please enter an answer.");return}userAnswers[current]=v;answered[current]=true;correctFlags[current]=normalize(v)===normalize(QUESTIONS[current].a);a.disabled=true;document.getElementById("checkBtn").disabled=true;document.getElementById("nextBtn").disabled=false;let f=document.getElementById("feedback");f.textContent=correctFlags[current]?"Correct! Well done!":"Better luck next time!";f.className=correctFlags[current]?"correct":"wrong"}
function nextQuestion(){if(!answered[current]){alert("Please answer the current question first.");return}if(current<QUESTIONS.length-1){current++;loadQuestion()}else showResults()}
function goToQuestion(){let n=parseInt(document.getElementById("jumpInput").value,10);if(isNaN(n)||n<1||n>QUESTIONS.length){alert("Please enter a question number from 1 to "+QUESTIONS.length+".");return}current=n-1;document.getElementById("jumpInput").value="";loadQuestion()}
document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});document.getElementById("jumpInput").addEventListener("keydown",e=>{if(e.key==="Enter")goToQuestion()});
function localDate(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function saveAttempt(score){let x=[];try{x=JSON.parse(localStorage.getItem("quizAttempts")||"[]")}catch(e){}x.push({date:localDate(),score:score,total:QUESTIONS.length,timestamp:new Date().toISOString()});localStorage.setItem("quizAttempts",JSON.stringify(x))}
function escapeHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function showResults(){document.getElementById("quizScreen").style.display="none";let r=document.getElementById("resultScreen");r.style.display="block";let score=correctFlags.filter(Boolean).length;saveAttempt(score);let h='<h1>Quiz Complete!</h1><div class="score">Score: '+score+' / '+QUESTIONS.length+'</div><div class="summary">Correct answers are shown below. Your answers are also recorded.</div>';QUESTIONS.forEach((x,i)=>{let ua=userAnswers[i]?escapeHtml(userAnswers[i]):"(Not answered)",ok=correctFlags[i];h+='<div class="result-row"><b>'+(i+1)+'. '+escapeHtml(x.q)+'</b><br>Your answer: <span class="user-answer">'+ua+'</span><br>Result: <span class="'+(ok?'correct':'wrong')+'">'+(ok?'Correct':'Wrong')+'</span><br>Correct answer: <span class="correct-answer">'+escapeHtml(x.a)+'</span></div>'});h+='<button class="dashboard-btn" onclick="showDashboard()">View Attempt History</button> <button onclick="location.reload()">Take Quiz Again</button>';r.innerHTML=h}
function showDashboard(){let r=document.getElementById("resultScreen"),x=[];try{x=JSON.parse(localStorage.getItem("quizAttempts")||"[]")}catch(e){}x.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));let h='<h1>Quiz Attempt History</h1>';if(!x.length)h+='<p>No attempts recorded yet.</p>';else{let g={};x.forEach(a=>(g[a.date]??=[]).push(a));Object.keys(g).sort().reverse().forEach(d=>{h+='<div class="summary"><h3>'+d+'</h3>';g[d].forEach((a,i)=>h+='<p>Attempt '+(i+1)+': <b>'+a.score+' / '+a.total+'</b></p>');h+='</div>'})}h+='<button onclick="location.reload()">Back to Quiz</button>';r.innerHTML=h}
loadQuestion();
</script></body></html>
